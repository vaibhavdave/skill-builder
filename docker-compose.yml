services:
  postgres:
    image: postgres:16
    container_name: skillbuilder-postgres
    environment:
      POSTGRES_DB: skillbuilder
      POSTGRES_USER: skillbuilder
      POSTGRES_PASSWORD: skillbuilder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbuilder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
