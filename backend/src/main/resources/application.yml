spring:
  application:
    name: skill-builder
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5448/skillbuilder}
    username: ${DB_USERNAME:skillbuilder}
    password: ${DB_PASSWORD:skillbuilder}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  storage:
    root: ${STORAGE_ROOT:./data/uploads}
  anthropic:
    model: claude-sonnet-5
